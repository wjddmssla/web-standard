<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1400">
    <title>SVG Scroll Animation</title>
    <link rel="stylesheet" href="css/main_style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 2000px;
            background-color: #f5f5f5;
        }

        header {
            height: 1000px;
            background-color: #eee;
        }

        #connect_heart {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1000px;
        }

        .inner_line {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* perspective: 2000px;
            transform: rotate(180deg); */
        }

        .heart_line svg {
            width: 637px;
            height: auto;
            /* transform: rotateY(180deg); */
        }

        /* SVG 선 애니메이션 (위에서 아래로) */
        .heart_line path {
            stroke-dasharray: 5000;
            stroke-dashoffset: 5000; /* 처음엔 선이 안 보이게 설정 */
            stroke: url(#SVGID_1_);
            stroke-width: 20;
            stroke-linecap: round;
            fill: none;
            transition: stroke-dashoffset 5s ease-out;
        }

        /* 클래스 추가 시 애니메이션 실행 (위에서 아래로 나타남) */
        .heart_line.visible path {
            stroke-dashoffset: 0;
        }
    </style>
</head>

<body>
    <header></header>

    <div id="connect_heart">
        <div class="inner_line">
            <div class="heart_line">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
                    x="0px" y="0px" viewBox="0 0 657 960" style="enable-background:new 0 0 657 960;" xml:space="preserve">
                    
                    <defs>
                        <linearGradient id="SVGID_1_" gradientUnits="userSpaceOnUse" x1="583.7363" y1="-118.9823" 
                            x2="238.9883" y2="832.8547" gradientTransform="matrix(1 0 0 -1 0 962)">
                            <stop offset="0" style="stop-color:#3DC0C3"/>
                            <stop offset="1" style="stop-color:#00A5E2"/>
                        </linearGradient>
                    </defs>

                    <path style="fill:none;stroke:url(#SVGID_1_);stroke-width:20;stroke-linecap:round;" 
                        d="M646.995,10L646.995,10
                        c-0.001,52.701-42.724,95.424-95.425,95.424H133.123C65.124,105.424,10,160.548,10,228.547l0,0
                        c0,67.999,55.124,123.123,123.123,123.123h120.784h269.969c67.996,0,123.118,55.122,123.118,123.118l0,0
                        c0,67.996-55.122,123.118-123.118,123.118H132.967C65.054,597.906,10,652.96,10,720.873l0,0
                        c0,67.913,55.054,122.967,122.967,122.967h319.721h88.145c58.632,0,106.163,47.528,106.167,106.16l0,0"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const heartLine = document.querySelector(".heart_line");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        heartLine.classList.add("visible");
                    }
                });
            }, {
                rootMargin: "-200px 0px 0px 0px", // 뷰포트에 살짝이라도 들어오면 감지
                threshold: 0.3 // 아주 조금이라도 보이면 애니메이션 실행
            });

            if (heartLine) {
                observer.observe(heartLine);
            }
        });
    </script>

</body>

</html>
