<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animate</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        button {
            background-color: aquamarine;
            display: block;
            margin: 30px;
            border: none;
            border-radius: 5px;
            color: white;
            padding: 10px 30px;
            cursor: pointer;
        }

        button:hover {
            background-color: mediumspringgreen;
        }

        div {
            width: 200px;
            height: 200px;
            background-color: #6dffce;
            position: absolute;
            left: 0;
            top: 100px;
        }
    </style>
</head>
<body>
    <button>click</button>

    <div></div>

    <script src="js/jquery-3.7.1.min.js"></script>

    <script>
        $("button").click(function(){
            $("div").animate({
                opacity:'0.5',
                left:'300px'
            },2000)
        });
    </script>
</body>
</html>
