<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js 기본작성법</title>
</head>
<body>
    <p>자바스크립트 JavaScript</p>
    <p id="text">자바스크립트 JavaScript</p>
