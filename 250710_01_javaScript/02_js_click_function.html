<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js click 함수</title>
</head>
<body>
    <p id="text" onclick="click1()">글자를 클릭하면 사라집니다.</p>
    <p>글자를 클릭하면 또 사라집니다.</p>

    <script>
        function click1() {
            document.getElementById('text').style.display='none';
        }


    </script>
</body>
</html>
