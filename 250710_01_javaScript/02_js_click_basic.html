<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS click</title>
</head>
<body>
    <p id="text1" onclick="document.getElementById('text1').style.display='none'">클릭하면 사라집니다.</p>
    <p id="text2" onclick="document.getElementById('text2').style.display='none'">클릭하면 또 사라집니다.</p>


</body>
</html>
