<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        #section1{
            height: 620px;
            background: url(images/bg1.jpg) no-repeat center;
        }

        #section2 {
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #section3 {
            position: relative;
            overflow: hidden;
            height: 620px;
        }

        #section3 img{
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        #section4 {
            width: 1000px;
            margin: 100px auto;
            /* background-color: blue; */
        }

        ul {
            list-style: none;
        }

        #section4 ul{
            display: flex;
            gap: 20px;
            /* justify-content: space-between; */
        }

        /* #section4 ul li{
            width: 25%;
            background-color: black;
        } */

        #section4 ul li img {
            width: 100%;
            display: block;
        }

        #section4 ul li img:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="section1"></div>
    <div id="section2">
        <img src="images/bg1.jpg" alt="">
    </div>
    <div id="section3">
        <img src="images/bg1.jpg" alt="">
    </div>
    <div id="section4">
        <ul>
            <li>
                <a href="#">
                    <img src="images/p1.png" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/p2.png" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/p3.png" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/p4.png" alt="">
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
