<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1400">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            height: 1000px;
            background-color: #eee;
        }

        /* 섹션1 */
        #section1 {
            height: 700px;
            overflow: hidden;
        }
        .section1_bg1 {
            margin-bottom: 100px;
        }
        .section1_bg1 p {
            width: 100%;
            height: 300px;
            background-color: antiquewhite;
            transform: translateX(-1600px);
            /* 초기 위치 설정 */
            transition: transform 2s ease-in-out;
            /* transition 사용 */
        }

        /* .animate 클래스가 추가되면 transform 속성 변경 */
        .section1_bg1.animate p {
            transform: translateX(0);
        }
        .section1_bg2 p {
            width: 100%;
            height: 300px;
            background-color: antiquewhite;
            transform: translateX(1600px);
            /* 초기 위치 설정 */
            transition: transform 2s ease-in-out;
            /* transition 사용 */
        }

        /* .animate 클래스가 추가되면 transform 속성 변경 */
        .section1_bg2.animate p {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div id="wrap">
        <header></header>

        <div id="section1">
            <div class="section1_bg1">
                <p></p>
            </div>
            <div class="section1_bg2">
                <p></p>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Intersection Observer 설정
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate');
                    } else {
                        entry.target.classList.remove('animate');
                    }
                });
            }, {
                threshold: 0.1 // 요소의 10%가 보일 때 애니메이션 실행
            });

            // 애니메이션을 적용할 요소
            const section1 = document.querySelector('#section1 .section1_bg1');
            if (section1) {
                observer.observe(section1);
            }
        });
    </script>

            const section1 = document.querySelector('#section1 .section1_bg2');

</body>

</html>
