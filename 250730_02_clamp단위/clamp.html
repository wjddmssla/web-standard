<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div{
            height: 800px;
            margin: 0 auto;
            background-color: yellowgreen;
            text-align: center;
        }
        p{
            font-size: clamp(11px, 3vw, 60px);
            /* font-size: clamp(최소값, 설정값, 최대값); */
        }
    </style>
</head>
<body>
    <div>
        <p>
            clamp는 
           <br>'꽉 붙잡다, 꽉물다, 클램프'를 의미하며, 
           <br>반응형의 글자 단위에 유용하게 사용됩니다.</p>
    </div>
</body>
</html>
